---
name: 🦝 Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    with:
      super-linter-variables: '{"VALIDATE_PYTHON_RUFF_FORMAT": "false"}'
    uses: ministryofjustice/analytical-platform-github-actions/.github/workflows/reusable-super-linter.yml@edf953a35f288dff2b0bca09b0f66ff1d90dad07 # v8.0.7
